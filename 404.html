<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina non trovata — WeTransport</title>
  <meta name="description" content="L'indirizzo non porta a niente: i passaggi non hanno una pagina propria, si aprono dall'app." />
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    .vuoto { max-width: 44ch; margin: 0 auto; padding: 80px 20px; text-align: center; }
    .vuoto p { color: var(--ink-soft); }
    .vuoto .logo { color: var(--primary); margin-bottom: 12px; }
  </style>
</head>
<body>
  <main class="vuoto">
    <div class="logo">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11m-14 0h14m-14 0a2 2 0 0 0-2 2v4h2m14-6a2 2 0 0 1 2 2v4h-2m-14 0v2h3v-2m11 0v2h3v-2m-3 0H8" />
      </svg>
    </div>
    <h1>Questa pagina non c'è</h1>
    <p>Può essere un indirizzo scritto a metà, o un link a un passaggio che nel frattempo è
    stato annullato. I passaggi non hanno un indirizzo proprio: si aprono dall'app.</p>
    <p><a href="/">Vai a WeTransport</a></p>
  </main>
</body>
</html>
