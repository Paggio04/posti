name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Dipendenze di sviluppo
        run: npm ci

      - name: Sintassi JavaScript
        run: |
          node --check app.js
          node --check config.js
          node --check playwright.config.js

      - name: Lint JavaScript (bloccante)
        run: npm run lint

      - name: Validazione HTML (bloccante)
        run: npm run validate

      # I rapporti di contrasto stavano scritti nei commenti del foglio di stile, cioe'
      # erano veri il giorno in cui qualcuno li aveva calcolati e mai piu' verificati.
      # Il tema scuro era finito sotto la soglia AA su nove coppie senza che niente lo
      # dicesse. Questo legge i token da style.css: se un colore si sposta, si sa qui.
      - name: Contrasto AA nei due temi (bloccante)
        run: npm run contrasto

      - name: Nessun segreto committato
        run: |
          ! grep -rEn "sb_secret|service_role|SUPABASE_SERVICE" --include='*.js' --include='*.html' --include='*.toml' . || (echo "Trovata chiave segreta nel repo" && exit 1)

  # Le migrazioni devono ricreare il backend da zero, e devono poter essere rilanciate
  # senza rompersi. Il vecchio supabase-setup.sql non faceva ne' l'una ne' l'altra cosa.
  # Vedi docs/ROADMAP.md, cantiere C2.
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Parti da un database vuoto
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/stub-supabase.sql

      - name: Applica le migrazioni in ordine
        run: |
          for f in supabase/migrations/*.sql; do
            echo "-> $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # **Fra la prima e la seconda passata, e non altrove.** Dalla 016 il permesso su
      # `rides` e' per colonna e viene ricalcolato da `blinda_coordinate()`: una colonna
      # aggiunta dopo, senza richiamarla, nasce invisibile al client. La seconda passata
      # rimedia da sola — ma in produzione si applica **una** volta, e li' la Home
      # andrebbe in errore per tutti. Un controllo messo dopo sarebbe sempre verde e non
      # misurerebbe lo stato che gli utenti vedono.
      - name: Le colonne nuove di `rides` restano leggibili (dopo UNA passata)
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-colonne-leggibili.sql

      - name: Riapplicale (devono essere ripetibili)
        run: |
          for f in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # Prima degli altri di proposito: i test che seguono aprono i permessi con
      # `grant all on all functions`, quindi da li' in poi l'ACL non e' piu' quella
      # che le migrazioni hanno lasciato.
      - name: Ogni funzione dichiara chi puo' chiamarla
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-acl-funzioni.sql

      - name: Le comitive sono davvero separate
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-isolamento.sql

      - name: Segnalazione, blocco e sospensione reggono
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-sicurezza.sql

      # Sta qui in mezzo per due ragioni opposte, e c'e' voluto un giro rosso per trovarle
      # tutte e due. Non per primo: `verifica-isolamento` contava i profili di **tutta** la
      # tabella, e i quattro utenti di questo test glieli facevano diventare sette (quel
      # conto ora e' per id, cosi' l'ordine non conta piu'). E non per ultimo, dove sarebbe
      # stato naturale: li' inserisce un passo anche un altro ramo aperto, e due modifiche
      # nello stesso punto sono un conflitto di merge garantito.
      - name: Le notifiche si accodano quando devono, e una volta sola
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-notifiche.sql

      - name: Chi aveva un posto sa che il passaggio e' stato annullato
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-annullamento.sql

      - name: Andata e ritorno sono un viaggio, e due andate restano vietate
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-andata-ritorno.sql

      - name: Tre grafie della stessa fermata sono un posto solo
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-fermate.sql

      - name: L'auto ha un profilo, e non si pubblica con quella di un altro
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-auto.sql

      - name: Un ospite occupa un posto, e la sua quota e' di chi lo ha portato
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-ospite.sql

      - name: Le regole della comitiva si leggono, e non bloccano un'eccezione
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-regole.sql

      - name: Una comitiva a tempo si chiude, ma i suoi dati restano
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-comitiva-a-tempo.sql

      - name: Un ritardo annunciato arriva a chi e' a bordo, e una volta per numero
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-ritardo.sql

      - name: Cancellare il proprio account non danneggia gli altri
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-cancellazione.sql

      - name: I passaggi in zona escono, e niente altro con loro
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-zona.sql

      # Vanno per ultimi di proposito, e in quest'ordine: i test qui sopra aprono i
      # permessi con un `grant all on all tables`, e questi due li richiudono — ciascuno
      # il proprio — prima di verificarli.
      - name: Le coordinate non escono dalla comitiva
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-coordinate.sql

      - name: La zona di una persona non esce dal suo profilo
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-profilo.sql

      - name: Le funzioni interne non si chiamano da un client
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-permessi.sql

      # I conti sono un dato fra due persone, non del gruppo: la stessa forma di C21
      # e C22, ma su denaro. Va dopo gli altri perche' ricostruisce le sue persone.
      - name: I conti restano fra le due parti
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-conti.sql

      - name: Aggiornamento dal vecchio schema, senza perdere dati
        run: |
          psql -v ON_ERROR_STOP=1 -q -c "create database aggiornamento"
          export PGDATABASE=aggiornamento
          psql -v ON_ERROR_STOP=1 -q -f supabase/test/stub-supabase.sql
          for f in supabase/migrations/*.sql; do
            case "$f" in *010_*) continue;; esac
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -q -c "grant usage on schema public to authenticated; grant all on all tables in schema public to authenticated"
          psql -v ON_ERROR_STOP=1 -q -f supabase/test/dati-prima-di-010.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/010_gruppo_obbligatorio.sql
          psql -v ON_ERROR_STOP=1 -q -c "grant all on all tables in schema public to authenticated"
          psql -v ON_ERROR_STOP=1 -q -f supabase/test/verifica-archivio-010.sql

      - name: Ogni migrazione si e' registrata
        run: |
          attese=$(ls supabase/migrations/*.sql | wc -l)
          registrate=$(psql -tAc "select count(*) from public.schema_migrations")
          echo "file: $attese, registrate: $registrate"
          [ "$attese" = "$registrate" ] || (echo "Una migrazione non si registra in schema_migrations" && exit 1)

  # Smoke test sull'ANTEPRIMA della pull request, non sul sito vivo: se e' rosso,
  # il merge (e quindi il deploy) non avviene. Vedi docs/ROADMAP.md, cantiere C1.
  e2e-anteprima:
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Trova l'anteprima Netlify di questo commit
        id: anteprima
        uses: actions/github-script@v7
        with:
          script: |
            // Netlify pubblica lo stato del deploy come commit status sul SHA della PR.
            // Aspettiamo quello: cosi' i test girano sulla build giusta, non su una vecchia.
            const sha = context.payload.pull_request.head.sha;
            const scadenza = Date.now() + 10 * 60 * 1000;
            const attesa = (ms) => new Promise((r) => setTimeout(r, ms));

            while (Date.now() < scadenza) {
              const { data } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: sha,
              });
              const st = data.statuses.find((s) => s.context.includes('netlify'));
              if (st && st.state === 'success' && (st.target_url || '').includes('netlify.app')) {
                core.info('Anteprima pronta: ' + st.target_url);
                core.setOutput('url', st.target_url);
                return;
              }
              if (st && (st.state === 'failure' || st.state === 'error')) {
                core.setFailed('Deploy Netlify fallito: ' + (st.target_url || 'nessun dettaglio'));
                return;
              }
              await attesa(15000);
            }

            // Nessuno stato da Netlify entro 10 minuti: puo' voler dire che l'integrazione
            // con GitHub non e' attiva. Si prova l'indirizzo prevedibile, e lo si dice.
            const url = `https://deploy-preview-${context.payload.pull_request.number}--wetransport.netlify.app`;
            core.warning('Nessuno stato Netlify sul commit; provo ' + url);
            core.setOutput('url', url);

      - name: Attendi che l'anteprima risponda
        run: |
          for i in $(seq 1 40); do
            codice=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.anteprima.outputs.url }}")
            [ "$codice" = "200" ] && echo "Anteprima raggiungibile" && exit 0
            echo "tentativo $i: HTTP $codice"
            sleep 15
          done
          echo "Anteprima irraggiungibile: ${{ steps.anteprima.outputs.url }}"
          exit 1

      - name: Installa Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E sull'anteprima
        env:
          BASE_URL: ${{ steps.anteprima.outputs.url }}
          # I test sui flussi veri (tests/flussi.spec.js) girano solo se questi tre
          # segreti esistono: servono due account di prova gia' confermati sul progetto
          # Supabase. Senza, quei test si saltano e restano gli smoke.
          WT_TEST_EMAIL_A: ${{ secrets.WT_TEST_EMAIL_A }}
          WT_TEST_EMAIL_B: ${{ secrets.WT_TEST_EMAIL_B }}
          WT_TEST_PASSWORD: ${{ secrets.WT_TEST_PASSWORD }}
        run: npx playwright test

  # Rete di sicurezza dopo la pubblicazione: verifica che il sito vivo stia in piedi.
  # Non protegge dal deploy rotto (gira dopo): quel compito e' di e2e-anteprima.
  e2e-produzione:
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Attendi il deploy Netlify
        run: sleep 60
      - name: Installa Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Smoke E2E sul sito vivo
        env:
          BASE_URL: https://wetransport.netlify.app
        run: npx playwright test
